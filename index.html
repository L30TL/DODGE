<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="description" content="Dodge — desvie no ritmo. Um toque e já era.">
  <title>Dodge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 11' shape-rendering='crispEdges'%3E%3Crect width='11' height='11' fill='%230e0e1c'/%3E%3Cpath d='M3 0h5v1h2v2h1v5h-1v2h-2v1H3v-1H1V8H0V3h1V1h2z' fill='%231a5560'/%3E%3Cpath d='M3 1h5v1h1v1h1v5H9v1H8v1H3V9H2V8H1V3h1V2h1z' fill='%234df3ff'/%3E%3Crect x='3' y='4' width='1' height='2' fill='%2307070f'/%3E%3Crect x='7' y='4' width='1' height='2' fill='%2307070f'/%3E%3C/svg%3E">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #000; touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #tela {
      display: block; image-rendering: pixelated; image-rendering: crisp-edges;
      background: #0e0e1c; touch-action: none;
    }
    #girar {
      display: none; position: fixed; inset: 0; z-index: 5; background: rgba(7,7,15,0.94);
      color: #f4f4ff; font: bold 18px monospace; letter-spacing: 2px;
      align-items: center; justify-content: center; flex-direction: column; text-align: center;
    }
    #girar .icone { font-size: 48px; margin-bottom: 12px; animation: girar 1.6s ease-in-out infinite; }
    @keyframes girar { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
    noscript { color: #fff; font: 16px monospace; }
  </style>
</head>
<body>
  <canvas id="tela" width="480" height="270"></canvas>
  <div id="girar"><div class="icone">▯</div><span></span></div>
  <noscript>O Dodge precisa de JavaScript.</noscript>

  <!-- ordem importa: cada arquivo usa os anteriores -->
  <script src="erros.js"></script>
  <script src="config.js"></script>
  <script src="save.js"></script>
  <script src="ui.js"></script>
  <script src="audio.js"></script>
  <script src="avatar.js"></script>
  <script src="input.js"></script>
  <script src="patterns.js"></script>
  <script src="sim.js"></script>
  <script src="render.js"></script>
  <script src="levels.js"></script>
  <script src="editor.js"></script>
  <script src="profile.js"></script>
  <script src="debug.js"></script>
  <script src="game.js"></script>
</body>
</html>
